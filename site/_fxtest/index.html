<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style>
<script type="module">
import * as THREE from "three";
import { createRenderer, loadEnv, makeComposer, quality } from "/src/js/gl/fx/index.js";
const c = document.querySelector("canvas");
const r = createRenderer(c); const s = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, .1, 100); cam.position.set(0,1,6); cam.lookAt(0,0,0);
s.environment = await loadEnv(r, "studio"); s.background = new THREE.Color(0x0b0c0d);
const m = new THREE.Mesh(new THREE.TorusKnotGeometry(1,.35,256,48), new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0, roughness:.05, transmission:1, thickness:1.2, ior:1.5, iridescence:1, clearcoat:1 }));
s.add(m); const e = new THREE.Mesh(new THREE.SphereGeometry(.3), new THREE.MeshBasicMaterial({ color:new THREE.Color("#d8ff4f").multiplyScalar(4) })); e.position.set(-2,1,-2); s.add(e);
const fx = makeComposer(r, s, cam, { gtao:true, dof:{focus:6} }); r.setSize(innerWidth, innerHeight, false); fx.setSize(innerWidth, innerHeight);
r.setAnimationLoop(()=>{ m.rotation.y += .01; fx.render(); });
window.__ok = quality.tier;
</script></head><body><canvas></canvas></body></html>

<!doctype html>
<html lang="ja" class="no-js">
  <head>
    <!--#include head -->
    <title>3D Gallery | OMORO</title>
    <meta name="description" content="OMORO 3D Gallery — 6つのセリフが浮かぶ暗いホールを、ドラッグとスクロールで歩き回る。" />
    <meta property="og:title" content="3D Gallery | OMORO" />
    <script type="module" src="/src/js/pages/gallery.js"></script>
  </head>
  <body class="page-gallery">
    <!--#include chrome -->
    <main id="main" class="g-main">
      <h1 class="sr-only">OMORO 3D ギャラリー</h1>
      <canvas class="g-canvas" aria-label="ベルベットの幕に囲まれた夜の美術館に、金の額縁に入った6枚のセリフが並ぶ3D空間。ドラッグで回転、クリックで寄る。" role="img" data-cursor="DRAG"></canvas>
      <div class="g-loading" aria-hidden="true">
        <div class="g-loading-inner"><span class="mono">LIGHTING THE HALL</span><i></i></div>
      </div>
      <div class="g-vignette" aria-hidden="true"></div>
      <div class="g-fallback" hidden>
        <span class="eyebrow">3D GALLERY / 06 FRAMES</span>
        <p>この端末では3D表示ができません。代わりに一覧をどうぞ。</p>
      </div>

      <div class="g-hud g-hud-top">
        <div class="g-title"><span class="eyebrow">3D GALLERY / THE DAUSO MUSEUM</span><strong class="display">夜の美術館で、<br />6枚の名場面を。</strong><span class="g-title-sub mono">VELVET HALL · 06 FRAMES · EST. 2016</span></div>
        <div class="g-layouts" role="group" aria-label="レイアウト">
          <button type="button" data-layout="ring" aria-pressed="true">◯ Ring</button>
          <button type="button" data-layout="helix" aria-pressed="false">∿ Helix</button>
          <button type="button" data-layout="wall" aria-pressed="false">▦ Wall</button>
        </div>
      </div>

      <div class="g-info" aria-live="polite">
        <span class="mono g-info-num">— / 06</span>
        <span class="g-info-bar" aria-hidden="true"><i></i></span><span class="g-info-bar" aria-hidden="true"><i></i></span>
        <p class="g-info-quote display">額縁を選んでください</p>
        <span class="g-info-speaker"></span>
        <p class="g-info-context"></p>
        <div class="g-info-actions" hidden>
          <a class="btn btn-primary g-open" href="#">特設ページ <span class="btn-arrow">↗</span></a>
          <button type="button" class="btn btn-ghost g-close">閉じる</button>
        </div>
      </div>

      <div class="g-hud g-hud-bottom">
        <div class="g-dots" role="group" aria-label="カードを選ぶ"></div>
        <div class="g-help mono"><span>DRAG 回転</span><span>WHEEL 移動</span><span>CLICK 寄る</span><span>1·2·3 配置</span><span>← → 送る</span></div>
        <div class="g-nav"><button type="button" class="icon-btn g-prev" aria-label="前のカード">←</button><button type="button" class="icon-btn g-next" aria-label="次のカード">→</button></div>
      </div>

      <noscript><p style="padding:120px 24px">3D表示にはJavaScriptが必要です。</p></noscript>
      <ul class="sr-only g-list"></ul>
    </main>
    <div class="g-footer-wrap"><!--#include footer --></div>
  </body>
</html>
